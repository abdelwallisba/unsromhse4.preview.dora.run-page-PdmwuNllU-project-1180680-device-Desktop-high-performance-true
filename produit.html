<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produit | LocalBox</title>
  <meta name="description" content="Fiche produit LocalBox : origine, fournisseuse, prix et livraison le jour même.">
  <meta name="theme-color" content="#cc6e28">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="magasin">
  <div id="site-header"></div>

  <main id="main">
    <section class="section">
      <div class="container" id="product"></div>
    </section>

    <section class="section section--white">
      <div class="container">
        <div class="section-head"><div><p class="eyebrow">Dans le même rayon</p><h2>Vous aimerez aussi</h2></div></div>
        <div class="grid grid-4 grid--products" id="related"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      const { D, C, qs, esc, fmt, param, productCard, thumb } = LB;
      const p = D.products.find((x) => x.id === param("id"));
      const host = qs("#product");

      if (!p) {
        host.innerHTML = '<div class="empty"><span class="emoji">🔍</span><h1>Produit introuvable</h1><p>Ce produit n\'existe plus ou le lien est incorrect.</p><a class="btn btn--primary" href="magasin.html">Retour au Magasin</a></div>';
        qs("#related").closest("section").remove();
        return;
      }

      const cat = D.magasinCategories.find((c) => c.id === p.cat);
      document.title = p.name + " — " + p.unit + " | LocalBox";
      let qty = 1;

      host.innerHTML =
        '<p class="breadcrumb"><a href="index.html">Accueil</a> › <a href="magasin.html">Magasin</a> › <a href="magasin.html?cat=' + cat.id + '">' + esc(cat.name) + "</a> › " + esc(p.name) + "</p>" +
        '<div class="product-detail">' +
        '<div class="product-visual">' + thumb(p) + "</div>" +
        "<div>" +
        (p.popular ? '<span class="pill pill--orange">Populaire</span> ' : "") + '<span class="pill">' + cat.emoji + " " + esc(cat.name) + "</span>" +
        '<h1 style="margin-top:12px">' + esc(p.name) + "</h1>" +
        '<p class="muted">' + esc(p.unit) + "</p>" +
        '<p class="price">' + fmt(p.price) + "</p>" +
        "<p>" + esc(p.desc) + "</p>" +
        '<ul class="spec-list">' +
        "<li>Origine : <strong>" + esc(p.origin) + "</strong></li>" +
        "<li>Fournisseuse partenaire : <strong>" + esc(p.supplier) + "</strong></li>" +
        "<li>Livraison le jour même à Cotonou et Abomey-Calavi</li>" +
        "<li>Remplacé ou remboursé s'il arrive abîmé</li>" +
        "</ul>" +
        '<div class="buy-row">' +
        '<div class="qty"><button type="button" id="minus" aria-label="Diminuer">−</button><span id="qty">1</span><button type="button" id="plus" aria-label="Augmenter">+</button></div>' +
        '<button class="btn btn--orange" id="add">Ajouter au panier · <span id="line-total">' + fmt(p.price) + "</span></button>" +
        "</div>" +
        '<p class="muted" style="font-size:.9rem">💡 Livraison offerte dès ' + fmt(C.magasin.freeDeliveryFrom) + " d'achats · Gagnez " + Math.floor(p.price / 1000) * C.points.perThousand + " LocalPoints avec cet article.</p>" +
        "</div></div>";

      const update = () => { qs("#qty").textContent = qty; qs("#line-total").textContent = fmt(p.price * qty); };
      qs("#minus").addEventListener("click", () => { qty = Math.max(1, qty - 1); update(); });
      qs("#plus").addEventListener("click", () => { qty++; update(); });
      qs("#add").addEventListener("click", () => LB.cart.add("magasin", p.id, qty));

      qs("#related").innerHTML = D.products.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 4).map(productCard).join("");
    })();
  </script>
</body>
</html>
